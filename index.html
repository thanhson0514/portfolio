<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WiK1ngST · Thẻ Thợ Săn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      referrerpolicy="no-referrer"
    />
    <style>
      :root {
        --bg: #050914;
        --bg2: #0a1124;
        --panel: rgba(10, 18, 38, 0.86);
        --panel2: rgba(14, 24, 50, 0.9);
        --line: #2a4a8a;
        --line-hi: #5b8cff;
        --glow: rgba(70, 130, 255, 0.45);
        --text: #e6ecff;
        --muted: #8a9bc4;
        --dim: #55658c;
        --blue: #4d8dff;
        --cyan: #5ee1ff;
        --violet: #8b7bff;

        --r-ex: #f5f7ff;
        --r-sss: #ff3d5a;
        --r-ss: #ff8a3d;
        --r-s: #ffc845;
        --r-a: #c56bff;
        --r-b: #7b83ff;
        --r-c: #4fd1c5;
        --r-d: #3ecf8e;
        --r-e: #6b7591;

        --cut: 14px;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --head: "Rajdhani", ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--head);
        font-size: 16px;
        overflow-x: hidden;
      }

      /* ---------- Background: grid + glow + motes ---------- */
      .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(900px 500px at 50% -10%, rgba(77, 141, 255, 0.22), transparent 60%),
          radial-gradient(700px 500px at 100% 100%, rgba(139, 123, 255, 0.14), transparent 60%),
          linear-gradient(180deg, var(--bg), var(--bg2));
      }

      .bg::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(77, 141, 255, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(77, 141, 255, 0.06) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 80%);
        -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 80%);
      }

      .bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.018) 0 1px,
          transparent 1px 3px
        );
      }

      #motes {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      /* ---------- Layout ---------- */
      .wrap {
        position: relative;
        z-index: 1;
        max-width: 1120px;
        margin: 0 auto;
        padding: 64px 20px 56px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 16px;
      }

      .span-12 { grid-column: span 12; }
      .span-8 { grid-column: span 8; }
      .span-7 { grid-column: span 7; }
      .span-6 { grid-column: span 6; }
      .span-5 { grid-column: span 5; }
      .span-4 { grid-column: span 4; }

      /* ---------- System window (cut-corner panel) ---------- */
      .win {
        --c: var(--cut);
        position: relative;
        padding: 1px;
        background: linear-gradient(160deg, var(--line-hi), var(--line) 30%, var(--line) 70%, var(--line-hi));
        clip-path: polygon(
          var(--c) 0, calc(100% - var(--c)) 0, 100% var(--c),
          100% calc(100% - var(--c)), calc(100% - var(--c)) 100%,
          var(--c) 100%, 0 calc(100% - var(--c)), 0 var(--c)
        );
        filter: drop-shadow(0 0 0 transparent);
        transition: filter 260ms ease, transform 260ms ease;
        opacity: 0;
        transform: translateY(14px) scale(0.985);
        animation: winIn 620ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        animation-delay: calc(var(--i, 0) * 70ms + 120ms);
      }

      .win:hover {
        filter: drop-shadow(0 0 14px var(--glow));
      }

      .win-in {
        position: relative;
        height: 100%;
        padding: 18px 20px 14px;
        background:
          radial-gradient(500px 180px at 50% 0%, rgba(77, 141, 255, 0.10), transparent 70%),
          linear-gradient(180deg, var(--panel2), var(--panel));
        clip-path: inherit;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* scanline sweep on hover */
      .win-in::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: -40%;
        height: 40%;
        background: linear-gradient(180deg, transparent, rgba(94, 225, 255, 0.07), transparent);
        opacity: 0;
        pointer-events: none;
      }

      .win:hover .win-in::after {
        opacity: 1;
        animation: sweep 1.4s linear infinite;
      }

      @keyframes sweep {
        to { top: 110%; }
      }

      @keyframes winIn {
        to {
          opacity: 1;
          transform: none;
        }
      }

      .win-title {
        position: relative;
        text-align: center;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--blue);
        text-shadow: 0 0 10px rgba(77, 141, 255, 0.6);
        margin: -4px -20px 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(77, 141, 255, 0.25);
      }

      .win-title.big {
        font-size: 15px;
        letter-spacing: 0.42em;
      }

      .win-foot {
        margin-top: auto;
        padding-top: 12px;
        text-align: right;
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.08em;
        color: var(--dim);
      }

      .label {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* ---------- Rank badges ---------- */
      .rank {
        --rc: var(--r-b);
        --s: 44px;
        width: calc(var(--s) * 1.35);
        height: var(--s);
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        font-family: var(--head);
        font-weight: 700;
        font-size: calc(var(--s) * 0.5);
        letter-spacing: 0.04em;
        color: var(--rc);
        border: 2px solid var(--rc);
        border-radius: 6px;
        background: color-mix(in srgb, var(--rc) 12%, transparent);
        box-shadow:
          0 0 12px color-mix(in srgb, var(--rc) 45%, transparent),
          inset 0 0 10px color-mix(in srgb, var(--rc) 25%, transparent);
        text-shadow: 0 0 10px color-mix(in srgb, var(--rc) 70%, transparent);
        position: relative;
      }

      .rank::before {
        content: "";
        position: absolute;
        inset: 3px;
        border: 1px solid color-mix(in srgb, var(--rc) 40%, transparent);
        border-radius: 3px;
      }

      .rank[data-r="EX"] { --rc: var(--r-ex); }
      .rank[data-r="SSS"] { --rc: var(--r-sss); }
      .rank[data-r="SS"] { --rc: var(--r-ss); }
      .rank[data-r="S"] { --rc: var(--r-s); }
      .rank[data-r="A"] { --rc: var(--r-a); }
      .rank[data-r="B"] { --rc: var(--r-b); }
      .rank[data-r="C"] { --rc: var(--r-c); }
      .rank[data-r="D"] { --rc: var(--r-d); }
      .rank[data-r="E"] { --rc: var(--r-e); }

      /* ---------- License ---------- */
      .license {
        display: grid;
        grid-template-columns: auto 1fr 1.35fr;
        gap: 28px;
        align-items: center;
      }

      .rankBox {
        display: grid;
        justify-items: center;
        gap: 10px;
      }

      .avatarFrame {
        position: relative;
        width: 108px;
        height: 108px;
        padding: 4px;
        border: 2px solid var(--r-ss);
        box-shadow: 0 0 22px rgba(255, 138, 61, 0.35), inset 0 0 18px rgba(255, 138, 61, 0.25);
        clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        background: rgba(255, 138, 61, 0.08);
      }

      .avatarFrame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        clip-path: inherit;
      }

      .avatarFrame .rank {
        position: absolute;
        right: -6px;
        bottom: -6px;
        --s: 30px;
        background: #0b1226;
      }

      .rankTop {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.1em;
      }

      .who h1 {
        margin: 0;
        font-size: clamp(30px, 4vw, 40px);
        font-weight: 700;
        letter-spacing: 0.02em;
        line-height: 1;
      }

      .typing::after {
        content: "";
        display: inline-block;
        width: 3px;
        height: 0.8em;
        margin-left: 4px;
        background: var(--cyan);
        box-shadow: 0 0 10px var(--cyan);
        animation: blink 0.9s steps(2) infinite;
        vertical-align: -0.05em;
      }

      @keyframes blink {
        50% { opacity: 0; }
      }

      .who .handle {
        margin: 6px 0 12px;
        font-family: var(--mono);
        font-size: 13px;
        color: var(--muted);
      }

      .meta {
        display: grid;
        gap: 5px;
        font-size: 15px;
        font-weight: 600;
      }

      .meta .k {
        display: inline-block;
        min-width: 92px;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        color: var(--dim);
      }

      .meta .title {
        color: var(--cyan);
        text-shadow: 0 0 12px rgba(94, 225, 255, 0.6);
        padding: 1px 8px;
        background: rgba(94, 225, 255, 0.08);
        border: 1px solid rgba(94, 225, 255, 0.25);
      }

      .flag {
        width: 20px;
        height: 13px;
        object-fit: cover;
        vertical-align: -1px;
        margin-right: 6px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px 16px;
      }

      .stat {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .stat .rank {
        --s: 34px;
      }

      .stat > div {
        min-width: 0;
      }

      .stat b {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.12em;
        color: var(--muted);
        font-weight: 500;
      }

      .stat div > span {
        display: block;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .stat small {
        display: block;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--dim);
      }

      /* ---------- Rows (character / log) ---------- */
      .rows {
        display: grid;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(77, 141, 255, 0.12);
        font-size: 15px;
        font-weight: 600;
      }

      .row:last-child {
        border-bottom: 0;
      }

      .row .label {
        flex: 0 0 auto;
      }

      .row > span:last-child {
        text-align: right;
      }

      .lore {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 14.5px;
        line-height: 1.5;
        font-weight: 500;
      }

      /* ---------- Skill status ---------- */
      .skillHead {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .skillLv {
        font-size: 34px;
        font-weight: 700;
        line-height: 1;
        color: var(--blue);
        text-shadow: 0 0 14px rgba(77, 141, 255, 0.6);
      }

      .skillName {
        display: block;
        margin-top: 4px;
        font-size: 22px;
        font-weight: 700;
      }

      .skillSub {
        margin-top: 4px;
        font-size: 14px;
        color: var(--muted);
      }

      .skillSub .k {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        color: var(--dim);
        margin-right: 8px;
      }

      .skillSub .title {
        color: var(--cyan);
        font-weight: 600;
      }

      .overallBox {
        display: flex;
        align-items: center;
        gap: 14px;
        text-align: right;
      }

      .overallBox b {
        display: block;
        font-size: 26px;
        line-height: 1.1;
      }

      .overallBox small {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.12em;
        color: var(--dim);
      }

      .overallBox .rank {
        --s: 52px;
      }

      .scale {
        margin-bottom: 20px;
      }

      .scaleRow {
        display: grid;
        gap: 3px;
      }

      .scaleLetters span {
        text-align: center;
        font-weight: 700;
        font-size: 15px;
        color: var(--sc);
      }

      .scaleTrack {
        position: relative;
        margin: 6px 0 4px;
      }

      .scaleBar span {
        height: 6px;
        background: var(--sc);
        opacity: 0.85;
      }

      .scaleNums span {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--dim);
      }

      .scaleMarker {
        position: absolute;
        top: -5px;
        width: 2px;
        height: 16px;
        margin-left: -1px;
        background: #fff;
        box-shadow: 0 0 10px var(--cyan);
      }

      .scaleYou {
        position: relative;
        height: 16px;
        margin-top: 2px;
      }

      .scaleYou span {
        position: absolute;
        transform: translateX(-50%);
        white-space: nowrap;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        color: var(--cyan);
      }

      .skillBody {
        display: grid;
        grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr);
        gap: 18px;
        align-items: stretch;
      }

      .skillRows {
        display: grid;
        gap: 6px;
      }

      .skillRow {
        display: grid;
        grid-template-columns: 34px auto minmax(0, 1fr) 44px auto;
        gap: 12px;
        align-items: center;
        padding: 8px 12px;
        background: rgba(77, 141, 255, 0.05);
        border: 1px solid rgba(77, 141, 255, 0.12);
        transition: background 160ms ease, border-color 160ms ease;
      }

      .skillRow:hover {
        background: rgba(77, 141, 255, 0.1);
        border-color: rgba(94, 225, 255, 0.35);
      }

      .skillKey {
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .skillRow .rank {
        --s: 30px;
      }

      .skillInfo {
        min-width: 0;
      }

      .skillInfo strong {
        font-size: 16px;
      }

      .skillInfo .tools {
        margin-left: 8px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }

      .skillInfo .line {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .skillInfo small {
        display: block;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.06em;
        color: var(--dim);
      }

      .skillBar {
        height: 3px;
        margin-top: 4px;
        background: rgba(255, 255, 255, 0.08);
      }

      .skillBar i {
        display: block;
        height: 100%;
        background: var(--rc);
        box-shadow: 0 0 8px var(--rc);
      }

      .skillVal {
        text-align: right;
        font-size: 22px;
        font-weight: 700;
      }

      .skillIcons {
        display: flex;
        gap: 8px;
        padding: 5px 10px;
        border: 1px solid rgba(77, 141, 255, 0.3);
        background: rgba(5, 10, 24, 0.5);
      }

      .skillIcons i {
        width: 14px;
        text-align: center;
        font-size: 13px;
        color: var(--cyan);
      }

      .radarBox {
        display: grid;
        place-items: center;
        padding: 10px;
        background: rgba(5, 10, 24, 0.45);
        border: 1px solid rgba(77, 141, 255, 0.14);
      }

      .radarBox svg {
        width: 100%;
        max-width: 320px;
        height: auto;
        overflow: visible;
      }

      .poly {
        transform-origin: 120px 120px;
        animation: polyIn 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s both;
      }

      @keyframes polyIn {
        from {
          transform: scale(0);
          opacity: 0;
        }
      }

      /* ---------- Quest (socials) ---------- */
      .questHead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .cleared {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        padding: 4px 10px;
        background: var(--blue);
        color: #fff;
        box-shadow: 0 0 14px rgba(77, 141, 255, 0.6);
      }

      .quest {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 2px;
        color: var(--text);
        text-decoration: none;
        font-size: 16px;
        font-weight: 600;
        border-bottom: 1px solid rgba(77, 141, 255, 0.12);
        transition: color 160ms ease, padding 160ms ease;
      }

      .quest:last-child {
        border-bottom: 0;
      }

      .quest .chk {
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        background: var(--blue);
        color: #fff;
        font-size: 11px;
        box-shadow: 0 0 10px rgba(77, 141, 255, 0.55);
        flex: 0 0 auto;
      }

      .quest .qi {
        width: 20px;
        text-align: center;
        color: var(--muted);
      }

      .quest .go {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--blue);
      }

      .quest:hover,
      .quest:focus-visible {
        color: var(--cyan);
        padding-left: 8px;
        outline: none;
      }

      .quest:hover .qi,
      .quest:focus-visible .qi {
        color: var(--cyan);
      }

      /* ---------- Spotlight / log ---------- */
      .spot {
        display: block;
        color: inherit;
        text-decoration: none;
        height: 100%;
      }

      .spotTop {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .spotTag {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.24em;
        color: var(--blue);
      }

      .star {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--r-s);
      }

      .spot h3 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 700;
        word-break: break-word;
      }

      .spot p {
        margin: 0;
        color: var(--muted);
        font-size: 14.5px;
        line-height: 1.45;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 2.9em;
      }

      .spotMeta {
        display: flex;
        gap: 16px;
        align-items: center;
        margin-top: 14px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--dim);
        flex-wrap: wrap;
      }

      .spotMeta .lang {
        color: var(--text);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .spotMeta .lang::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--lc, var(--blue));
        box-shadow: 0 0 6px var(--lc, var(--blue));
      }

      .spot:hover h3,
      .spot:focus-visible h3 {
        color: var(--cyan);
      }

      .log {
        display: grid;
        gap: 2px;
        font-family: var(--mono);
        font-size: 12px;
      }

      .logItem {
        display: grid;
        grid-template-columns: 18px 1fr auto;
        gap: 10px;
        align-items: baseline;
        padding: 7px 0;
        border-bottom: 1px dashed rgba(77, 141, 255, 0.14);
        color: var(--text);
      }

      .logItem:last-child {
        border-bottom: 0;
      }

      .logItem i {
        color: var(--blue);
        font-size: 11px;
      }

      .logItem span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .logItem time {
        color: var(--dim);
        font-size: 11px;
      }

      .empty {
        color: var(--dim);
        font-family: var(--mono);
        font-size: 12px;
      }

      /* ---------- Oracle ---------- */
      .oracle q {
        display: block;
        quotes: none;
        font-size: 21px;
        font-weight: 700;
        line-height: 1.3;
        margin: 6px 0 10px;
      }

      .oracle .mark {
        font-size: 28px;
        color: var(--blue);
        line-height: 1;
        text-shadow: 0 0 12px rgba(77, 141, 255, 0.7);
      }

      .oracle cite {
        font-style: normal;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
      }

      /* ---------- Sở thích · Game (Valorant) ---------- */
      .valHead {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }

      .valId {
        display: grid;
        gap: 2px;
      }

      .valLogo {
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.32em;
        color: #ff4655;
        text-shadow: 0 0 12px rgba(255, 70, 85, 0.6);
      }

      .valId strong {
        font-size: 26px;
        line-height: 1.1;
      }

      .valId small,
      .valLink {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.12em;
        color: var(--dim);
      }

      .valLink {
        color: var(--blue);
        text-decoration: none;
        padding: 6px 10px;
        border: 1px solid rgba(77, 141, 255, 0.35);
      }

      .valLink:hover {
        color: var(--cyan);
        border-color: var(--cyan);
      }

      .valGrid {
        display: grid;
        grid-template-columns: 1.1fr 1.6fr 1.1fr;
        gap: 16px;
      }

      .valBox {
        padding: 14px;
        background: rgba(77, 141, 255, 0.05);
        border: 1px solid rgba(77, 141, 255, 0.16);
        min-width: 0;
      }

      .valBox > .label {
        display: block;
        margin-bottom: 10px;
      }

      .valRank {
        display: flex;
        gap: 14px;
        align-items: center;
      }

      .valRank img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        filter: drop-shadow(0 0 12px rgba(255, 70, 85, 0.35));
        flex: 0 0 auto;
      }

      .valRank strong {
        display: block;
        font-size: 24px;
        line-height: 1.1;
      }

      .rrBar {
        height: 6px;
        margin: 8px 0 4px;
        background: rgba(255, 255, 255, 0.08);
      }

      .rrBar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #ff4655, #ff8a3d);
        box-shadow: 0 0 10px rgba(255, 70, 85, 0.6);
      }

      .rrMeta {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }

      .up { color: #3ee08f; }
      .down { color: #ff4655; }

      .peak {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid rgba(77, 141, 255, 0.14);
        font-size: 14px;
        font-weight: 600;
      }

      .peak img {
        width: 26px;
        height: 26px;
      }

      .peak .label {
        margin-right: auto;
      }

      .tiles {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .tile b {
        display: block;
        font-size: clamp(18px, 4.6vw, 24px);
        overflow-wrap: anywhere;
        line-height: 1.1;
      }

      .tile small {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.12em;
        color: var(--dim);
      }

      .agentRow {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 6px 0;
      }

      .agentRow img {
        width: 34px;
        height: 34px;
        background: rgba(255, 255, 255, 0.05);
      }

      .agentRow > div {
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .agentRow strong {
        font-size: 15px;
      }

      .agentRow small,
      .agentRow span {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }

      .matches {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
        margin-top: 16px;
      }

      .match {
        --mc: #ff4655;
        display: grid;
        grid-template-columns: 30px 1fr auto;
        gap: 8px;
        align-items: center;
        padding: 8px 10px;
        background: linear-gradient(90deg, color-mix(in srgb, var(--mc) 16%, transparent), transparent 70%);
        border-left: 3px solid var(--mc);
        min-width: 0;
      }

      .match.W { --mc: #3ee08f; }
      .match.D { --mc: #8a9bc4; }

      .match img {
        width: 30px;
        height: 30px;
      }

      .match div {
        min-width: 0;
      }

      .match strong {
        display: block;
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .match small {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--muted);
      }

      .match .res {
        text-align: right;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        color: var(--mc);
      }

      .match .res small {
        display: block;
        font-weight: 400;
        color: var(--dim);
      }

      .arise {
        font-family: var(--head);
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.4em;
        text-align: center;
        color: var(--violet);
        text-shadow: 0 0 14px rgba(139, 123, 255, 0.9);
        margin: 28px 0 0;
        opacity: 0.8;
      }

      /* ---------- Language switch ---------- */
      .langSwitch {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 10;
        display: flex;
        padding: 1px;
        background: linear-gradient(160deg, var(--line-hi), var(--line));
        clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
      }

      .langSwitch button {
        appearance: none;
        border: 0;
        margin: 0;
        padding: 7px 12px;
        min-width: 44px;
        min-height: 32px;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--muted);
        background: var(--panel2);
        cursor: pointer;
        transition: color 160ms ease, background 160ms ease;
      }

      .langSwitch button + button {
        border-left: 1px solid var(--line);
      }

      .langSwitch button:hover {
        color: var(--cyan);
      }

      .langSwitch button[aria-pressed="true"] {
        color: #fff;
        background: var(--blue);
        box-shadow: inset 0 0 12px rgba(94, 225, 255, 0.35);
      }

      .langSwitch button:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: -2px;
      }

      a:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 3px;
      }

      /* ---------- Responsive ---------- */
      @media (max-width: 980px) {
        .license {
          grid-template-columns: auto 1fr;
        }
        .stats {
          grid-column: 1 / -1;
        }
        .span-8, .span-7, .span-6, .span-5, .span-4 {
          grid-column: span 6;
        }
        .span-8, .span-7 {
          grid-column: span 12;
        }
        .valGrid {
          grid-template-columns: 1fr 1fr;
        }
        .skillBody {
          grid-template-columns: 1fr;
        }
        .valGrid .valBox:nth-child(2) {
          grid-column: 1 / -1;
          order: 3;
        }
        .matches {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 680px) {
        .wrap {
          padding: 60px 16px 40px;
        }
        .span-8, .span-7, .span-6, .span-5, .span-4 {
          grid-column: span 12;
        }
        .license {
          grid-template-columns: 1fr;
          justify-items: center;
          text-align: center;
          gap: 20px;
        }
        .meta .k {
          min-width: 0;
          margin-right: 8px;
        }
        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          justify-items: start;
          text-align: left;
          width: 100%;
        }
        .slotRow {
          grid-template-columns: 1fr;
          gap: 6px;
        }
        .valGrid,
        .matches {
          grid-template-columns: 1fr;
        }
        .match:nth-child(n + 5) {
          display: none;
        }
        .skillRow {
          grid-template-columns: 30px auto minmax(0, 1fr) auto;
          gap: 10px;
          padding: 8px 10px;
        }
        .skillIcons {
          display: none;
        }
        .skillInfo .tools {
          display: block;
          margin: 0;
        }
        .overallBox {
          text-align: left;
          flex-direction: row-reverse;
        }
        .tiles {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .win-in {
          padding: 16px 14px 12px;
        }
        .win-title {
          margin-left: -14px;
          margin-right: -14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 1ms !important;
          animation-delay: 0ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
        }
      }
    </style>
  </head>

          ev: {
            push: (n, r) => (n ? `Pushed ${n} commit${n > 1 ? "s" : ""} to ${r}` : `Pushed to ${r}`),
            create: (t, ref, r) => `Created ${t}${ref ? " " + ref : ""} in ${r}`,
            star: (r) => `Starred ${r}`,

            comment: (r) => `Commented on ${r}`,
            del: (t, r) => `Deleted ${t} in ${r}`,
          },
          locale: "en-US",
        },
      };

      const LANGS = ["vi", "en"];
      let lang = "vi";
      try {
        const q = new URLSearchParams(location.search).get("lang");
        const saved = localStorage.getItem("lang");
        if (LANGS.includes(q)) lang = q;
        else if (LANGS.includes(saved)) lang = saved;
      } catch (e) {}
      const t = (k) => I18N[lang][k];

      // Self-assessed skills (0–100) — edit freely; ranks, bars, radar and the
      // license card are all derived from these scores.
      const SKILLS = [
        { key: "STR", group: "backend", score: 76, tools: "Node.js · NestJS · Express",
          icons: ["fa-brands fa-node-js", "fa-solid fa-feather", "fa-solid fa-route"] },
        { key: "AGI", group: "frontend", score: 85, tools: "React · Next.js · Tailwind · Vite",
          icons: ["fa-brands fa-react", "fa-solid fa-n", "fa-solid fa-wind", "fa-solid fa-bolt"] },
        { key: "INT", group: "language", score: 78, tools: "TypeScript · JavaScript",
          icons: ["fa-solid fa-code", "fa-brands fa-js"] },
        { key: "VIT", group: "database", score: 66, tools: "PostgreSQL · Redis",
          icons: ["fa-solid fa-database", "fa-solid fa-layer-group"] },
        { key: "LUK", group: "api", score: 74, tools: "GraphQL · REST",
          icons: ["fa-solid fa-diagram-project", "fa-solid fa-plug"] },
        { key: "CHA", group: "devops", score: 55, tools: "Docker · Kubernetes",
          icons: ["fa-brands fa-docker", "fa-solid fa-dharmachakra"] },
      ];

      // [rank, min score, color, width weight on the scale bar]
      const RANKS = [
        ["E", 0, "#6b7591", 1], ["D", 20, "#3ecf8e", 1], ["C", 35, "#4fd1c5", 1],
        ["B", 50, "#7b83ff", 1], ["A", 62, "#c56bff", 1.2], ["S", 72, "#ffc845", 1.4],
        ["SS", 82, "#ff8a3d", 1.6], ["SSS", 90, "#ff3d5a", 2], ["EX", 97, "#f5f7ff", 2],
      ];
      const rankIndex = (score) => RANKS.reduce((idx, r, i) => (score >= r[1] ? i : idx), 0);
      const rankOf = (score) => RANKS[rankIndex(score)][0];
      const RANK_COLOR = Object.fromEntries(RANKS.map((r) => [r[0], r[2]]));
      const AVG = Math.round(SKILLS.reduce((sum, k) => sum + k.score, 0) / SKILLS.length);

      const LANG_COLOR = {
        JavaScript: "#f1e05a", TypeScript: "#3178c6", HTML: "#e34c26", CSS: "#563d7c",
        Python: "#3572A5", Go: "#00ADD8", Java: "#b07219", "C#": "#178600", Vue: "#41b883",
        Shell: "#89e051", Rust: "#dea584", PHP: "#4F5D95", SCSS: "#c6538c",
      };

      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, text) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      };
      const fmtDate = (d) => new Date(d).toISOString().slice(0, 10);
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      document.querySelectorAll(".syncDate").forEach((n) => (n.textContent = fmtDate(Date.now())));

      // Fetched data, kept so a language switch re-renders without refetching.
      // undefined = loading, null = failed.
      const data = { repos: undefined, allRepos: undefined, events: undefined, val: undefined };

      // ---------- Radar (language-independent) ----------
      (function radar() {
        const svg = $("radar");
        const NS = "http://www.w3.org/2000/svg";
        const cx = 120, cy = 120, R = 80, n = SKILLS.length;
        const pt = (i, v) => {
          const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
          return [cx + Math.cos(a) * R * v, cy + Math.sin(a) * R * v];
        };
        const mk = (tag, attrs, parent = svg) => {
          const node = document.createElementNS(NS, tag);
          for (const k in attrs) node.setAttribute(k, attrs[k]);
          parent.append(node);
          return node;
        };
        const ring = (v) => SKILLS.map((_, i) => pt(i, v).join(",")).join(" ");
        [0.25, 0.5, 0.75, 1].forEach((v) =>
          mk("polygon", { points: ring(v), fill: "none", stroke: "rgba(77,141,255,0.22)", "stroke-width": 1 })
        );
        // Dashed ring marks the SSS threshold, like the reference card.
        const sss = RANKS.find((r) => r[0] === "SSS")[1] / 100;
        mk("polygon", { points: ring(sss), fill: "none", stroke: "rgba(255,61,90,0.55)", "stroke-dasharray": "3 3" });
        SKILLS.forEach((k, i) => {
          const [x, y] = pt(i, 1);
          mk("line", { x1: cx, y1: cy, x2: x, y2: y, stroke: "rgba(77,141,255,0.18)" });
          const [lx, ly] = pt(i, 1.22);
          const rk = rankOf(k.score);
          mk("text", {
            x: lx, y: ly - 3, "text-anchor": "middle", "font-family": "JetBrains Mono, monospace",
            "font-size": 9, fill: "#8a9bc4", "letter-spacing": "0.08em",
          }).textContent = k.key;
          mk("text", {
            x: lx, y: ly + 10, "text-anchor": "middle", "font-family": "Rajdhani, sans-serif",
            "font-size": 13, "font-weight": 700, fill: RANK_COLOR[rk],
          }).textContent = rk;
        });
        const pts = SKILLS.map((k, i) => pt(i, k.score / 100));
        const g = mk("g", { class: "poly" });
        mk("polygon", {
          points: pts.map((p) => p.join(",")).join(" "),
          fill: "rgba(77,141,255,0.3)", stroke: "#5ee1ff", "stroke-width": 1.5,
          style: "filter: drop-shadow(0 0 6px rgba(94,225,255,0.7))",
        }, g);
        pts.forEach(([x, y], i) =>
          mk("circle", { cx: x, cy: y, r: 3.5, fill: RANK_COLOR[rankOf(SKILLS[i].score)] }, g)
        );
      })();

      // Overall rank on the avatar and skill header.
      for (const id of ["avatarRank", "overallRank"]) {
        $(id).textContent = $(id).dataset.r = rankOf(AVG);
      }
      $("avatarLv").textContent = $("skillLv").textContent = `LV. ${AVG}`;
      $("overallScore").textContent = `${AVG} / 100`;

      // ---------- Typing name ----------
      (function typing() {
        const node = $("typingName");
        const words = ["WiK1ngST", "Wist"];
        if (reduced) return;
        let w = 0, c = words[0].length, del = true;
        const tick = () => {
          const word = words[w];
          if (del) {
            c--;
            node.textContent = word.slice(0, c);
            if (c <= 0) {
              del = false;
              w = (w + 1) % words.length;
              return setTimeout(tick, 220);
            }
            setTimeout(tick, 55);
          } else {
            c++;
            node.textContent = words[w].slice(0, c);
            if (c >= words[w].length) {
              del = true;
              return setTimeout(tick, 2600);
            }
            setTimeout(tick, 110 + Math.random() * 50);
          }
        };
        setTimeout(tick, 2600);
      })();

      // ---------- Renderers ----------
      function renderStats() {
        const box = $("stats");
        box.textContent = "";
        SKILLS.forEach((k) => {
          const rk = rankOf(k.score);
          const row = el("div", "stat");
          const r = el("span", "rank", rk);
          r.dataset.r = rk;
          const txt = el("div");
          txt.append(
            el("b", null, t("skillGroups")[k.group].toUpperCase()),
            el("span", null, k.tools.split(" · ")[0]),
            el("small", null, `${k.key} · ${t("rankWord")} ${rk}`)
          );
          row.append(r, txt);
          box.append(row);
        });
      }

      function renderSkills() {
        // Scale bar E → EX with a marker at the average score.
        const scale = $("scale");
        scale.textContent = "";
        const cols = RANKS.map((r) => r[3] + "fr").join(" ");
        const total = RANKS.reduce((sum, r) => sum + r[3], 0);
        const row = (cls, fn) => {
          const d = el("div", "scaleRow " + cls);
          d.style.gridTemplateColumns = cols;
          RANKS.forEach((r, i) => {
            const sp = el("span", null, fn(r, i));
            sp.style.setProperty("--sc", r[2]);
            d.append(sp);
          });
          return d;
        };
        const i = rankIndex(AVG);
        const lo = RANKS[i][1], hi = RANKS[i + 1]?.[1] ?? 100;
        const before = RANKS.slice(0, i).reduce((sum, r) => sum + r[3], 0);
        const pos = ((before + RANKS[i][3] * Math.min(1, (AVG - lo) / (hi - lo))) / total) * 100;
        const track = el("div", "scaleTrack");
        const marker = el("i", "scaleMarker");
        marker.style.left = pos + "%";
        track.append(row("scaleBar", () => ""), marker);
        const you = el("div", "scaleYou");
        const ys = el("span", null, t("you")(AVG));
        ys.style.left = `clamp(40px, ${pos}%, calc(100% - 40px))`;
        you.append(ys);
        scale.append(row("scaleLetters", (r) => r[0]), track, row("scaleNums", (r) => r[1]), you);

        // Skill rows
        const rows = $("skillRows");
        rows.textContent = "";
        SKILLS.forEach((k) => {
          const ri = rankIndex(k.score);
          const [rk, min, color] = RANKS[ri];
          const next = RANKS[ri + 1];
          const r = el("div", "skillRow");
          r.style.setProperty("--rc", color);
          const badge = el("span", "rank", rk);
          badge.dataset.r = rk;
          const info = el("div", "skillInfo");
          const line = el("div", "line");
          line.append(el("strong", null, t("skillGroups")[k.group]), el("span", "tools", k.tools));
          const bar = el("div", "skillBar");
          const fill = el("i");
          fill.style.width = (next ? ((k.score - min) / (next[1] - min)) * 100 : 100) + "%";
          bar.append(fill);
          info.append(line, el("small", null, next ? t("nextAt")(next[0], next[1]) : t("maxRank")), bar);
          const icons = el("div", "skillIcons");
          k.icons.forEach((c) => icons.append(el("i", c)));
          r.append(el("span", "skillKey", k.key), badge, info, el("span", "skillVal", String(k.score)), icons);
          rows.append(r);
        });

        renderTopLang();
      }

      // Most common primary language across the user's own repos (real GitHub data).
      function renderTopLang() {
        const box = $("topLang");
        const repos = (data.allRepos || []).filter((r) => r.language);
        if (!repos.length) {
          box.textContent = "";
          return;
        }
        const counts = {};
        repos.forEach((r) => (counts[r.language] = (counts[r.language] || 0) + 1));
        const [top, n] = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
        box.textContent = t("topLang")(top, Math.round((n / repos.length) * 1000) / 10);
      }

      function renderOracle() {
        const quotes = t("quotes");
        const [qt, qc] = quotes[Math.floor(Date.now() / 86400000) % quotes.length];
        $("oracleQuote").textContent = qt;
        $("oracleCite").textContent = qc;
      }

      const ago = (d, short) => {
        const s = (Date.now() - new Date(d)) / 1000;
        const a = t(short ? "agoShort" : "ago");
        const sep = lang === "vi" ? " " : "";
        if (s < 3600) return Math.max(1, Math.round(s / 60)) + sep + a.m;
        if (s < 86400) return Math.round(s / 3600) + sep + a.h;
        return Math.round(s / 86400) + sep + a.d;
      };

      function renderSpot(target, repo) {
        target.textContent = "";
        if (repo === undefined) {
          target.append(el("div", "empty", t("spotLoading")));
          return;
        }
        if (!repo) {
          target.append(el("div", "win-title", t("spotlight")), el("div", "empty", t("noQuest")));
          return;
        }
        const a = el("a", "spot");
        a.href = repo.html_url;
        const top = el("div", "spotTop");
        top.append(el("span", "spotTag", t("spotTag")), el("span", "star", "★ " + repo.stargazers_count));
        const meta = el("div", "spotMeta");
        const lng = el("span", repo.language ? "lang" : null, repo.language || "—");
        if (repo.language && LANG_COLOR[repo.language]) lng.style.setProperty("--lc", LANG_COLOR[repo.language]);
        meta.append(lng, el("span", null, t("forks")(repo.forks_count)), el("span", null, `${t("pushed")} ${fmtDate(repo.pushed_at)}`));
        a.append(top, el("h3", null, repo.name), el("p", null, repo.description || t("noDesc")), meta);
        target.append(a);
      }

      function renderSpots() {
        const r = data.repos;
        [0, 1].forEach((i) => renderSpot($("spot" + i), r === undefined ? undefined : r?.[i] ?? null));
      }

      function describe(ev) {
        const r = ev.repo.name;
        const p = ev.payload || {};
        const e = t("ev");
        switch (ev.type) {
          case "PushEvent":
            return ["fa-solid fa-arrow-up", e.push(p.size ?? p.commits?.length, r)];
          case "CreateEvent":
            return ["fa-solid fa-plus", e.create(p.ref_type, p.ref, r)];
          case "WatchEvent":
            return ["fa-solid fa-star", e.star(r)];
          case "ForkEvent":
            return ["fa-solid fa-code-fork", e.fork(r)];
          case "PullRequestEvent":
            return ["fa-solid fa-code-pull-request", e.pr(p.action, p.number, r)];
          case "IssuesEvent":
            return ["fa-solid fa-circle-dot", e.issue(p.action, r)];
          case "IssueCommentEvent":
            return ["fa-solid fa-comment", e.comment(r)];
          case "DeleteEvent":
            return ["fa-solid fa-trash", e.del(p.ref_type, r)];
          default:
            return ["fa-solid fa-bolt", `${ev.type.replace("Event", "")} · ${r}`];
        }
      }

      function renderLog() {
        const log = $("log");
        log.textContent = "";
        if (data.events === undefined) return log.append(el("div", "empty", t("logLoading")));
        if (data.events === null) return log.append(el("div", "empty", t("logError")));
        if (!data.events.length) return log.append(el("div", "empty", t("logEmpty")));
        data.events.slice(0, 6).forEach((ev) => {
          const [icon, text] = describe(ev);
          const row = el("div", "logItem");
          const time = el("time", null, ago(ev.created_at));
          time.dateTime = ev.created_at;
          row.append(el("i", icon), el("span", null, text), time);
          log.append(row);
        });
      }

      // ---------- Sở thích · Game: Valorant (served by api/valorant.js on Vercel) ----------
      function renderValorant() {
        const body = $("valBody");
        body.textContent = "";
        const v = data.val;
        if (!v) {
          $("valSub").textContent = `${t("competitive")} · PC`;
          body.append(el("div", "empty", v === undefined ? t("valLoading") : t("valError")));
          return;
        }
        const { account, rank, stats } = v;

        $("valRiotId").textContent = `${account.name}#${account.tag}`;
        $("valSub").textContent = `${t("competitive")} · ${String(account.region).toUpperCase()} · LV ${account.level ?? "—"}` +
          (stats.season ? ` · ${stats.season.toUpperCase()}` : "");
        $("valSynced").textContent = new Date(v.updatedAt).toLocaleString(t("locale"));

        const grid = el("div", "valGrid");

        // Rank box
        const rb = el("div", "valBox");
        rb.append(el("span", "label", t("currentRank")));
        const rk = el("div", "valRank");
        if (rank.icon) {
          const img = el("img");
          img.src = rank.icon;
          img.alt = rank.name;
          rk.append(img);
        }
        const rInfo = el("div");
        rInfo.style.flex = "1";
        const bar = el("div", "rrBar");
        const fill = el("i");
        fill.style.width = Math.min(100, rank.rr) + "%";
        bar.append(fill);
        const meta = el("div", "rrMeta", `${rank.rr} RR `);
        if (rank.lastChange != null) {
          meta.append(el("span", rank.lastChange >= 0 ? "up" : "down",
            t("lastGame")(`${rank.lastChange >= 0 ? "+" : ""}${rank.lastChange}`)));
        }
        rInfo.append(el("strong", null, rank.name), bar, meta);
        rk.append(rInfo);
        rb.append(rk);
        if (rank.peakName) {
          const pk = el("div", "peak");
          pk.append(el("span", "label", t("peak")));
          if (rank.peakIcon) {
            const pi = el("img");
            pi.src = rank.peakIcon;
            pi.alt = "";
            pk.append(pi);
          }
          pk.append(el("span", null, rank.peakName + (rank.peakSeason ? ` · ${rank.peakSeason.toUpperCase()}` : "")));
          rb.append(pk);
        }

        // Stat tiles
        const sb = el("div", "valBox");
        sb.append(el("span", "label", t("thisAct")(stats.matches)));
        const tiles = el("div", "tiles");
        [
          [stats.winRate + "%", t("winTile")(stats.wins, stats.losses)],
          [stats.kd, "K/D"],
          [stats.hsPct + "%", t("headshot")],
          [stats.acs, "ACS"],
          [stats.adr, "ADR"],
          [`${stats.kills}/${stats.deaths}/${stats.assists}`, "K / D / A"],
        ].forEach(([val, lbl]) => {
          const tile = el("div", "tile");
          tile.append(el("b", null, String(val)), el("small", null, lbl));
          tiles.append(tile);
        });
        sb.append(tiles);

        // Top agents
        const ab = el("div", "valBox");
        ab.append(el("span", "label", t("mainAgents")));
        if (!stats.topAgents.length) ab.append(el("div", "empty", t("noMatches")));
        stats.topAgents.forEach((a) => {
          const r = el("div", "agentRow");
          const img = el("img");
          img.src = a.icon || "";
          img.alt = "";
          const mid = el("div");
          mid.append(el("strong", null, a.name), el("small", null, t("nMatches")(a.matches)));
          r.append(img, mid, el("span", null, `${a.winRate}% · ${a.kd} KD`));
          ab.append(r);
        });

        grid.append(rb, sb, ab);
        body.append(grid);

        // Recent matches
        if (stats.recent.length) {
          const list = el("div", "matches");
          stats.recent.forEach((m) => {
            const row = el("div", "match " + m.result);
            const img = el("img");
            img.src = m.agentIcon || "";
            img.alt = m.agent || "";
            const mid = el("div");
            mid.append(el("strong", null, m.map || "—"), el("small", null, `${m.kills}/${m.deaths}/${m.assists} · ACS ${m.acs}`));
            const res = el("div", "res", `${t("result")[m.result]} ${m.score}`);
            res.append(el("small", null, m.startedAt ? ago(m.startedAt, true) : ""));
            row.append(img, mid, res);
            list.append(row);
          });
          body.append(list);
        }
      }

      // ---------- Language switch ----------
      function applyLang() {
        document.documentElement.lang = lang;
        document.title = t("pageTitle");
        document.querySelectorAll("[data-i18n]").forEach((n) => (n.textContent = t(n.dataset.i18n)));
        document.querySelectorAll("[data-i18n-aria]").forEach((n) =>
          n.setAttribute("aria-label", t(n.dataset.i18nAria).replace(/[[\]]/g, "").trim())
        );
        document.querySelectorAll(".langSwitch button").forEach((b) =>
          b.setAttribute("aria-pressed", String(b.dataset.lang === lang))
        );
        renderStats();
        renderSkills();
        renderOracle();
        renderSpots();
        renderLog();
        renderValorant();
      }

      document.querySelectorAll(".langSwitch button").forEach((b) =>
        b.addEventListener("click", () => {
          if (b.dataset.lang === lang) return;
          lang = b.dataset.lang;
          try {
            localStorage.setItem("lang", lang);
          } catch (e) {}
          const url = new URL(location.href);
          url.searchParams.delete("lang");
          history.replaceState(null, "", url);
          applyLang();
        })
      );

      applyLang();

      // ---------- GitHub data ----------
      const gh = (path) =>
        fetch("https://api.github.com/" + path, { headers: { Accept: "application/vnd.github+json" } })
          .then((r) => (r.ok ? r.json() : Promise.reject(r.status)));

      gh("users/" + GH_USER)
        .then((u) => {
          $("awakened").textContent = fmtDate(u.created_at);
          $("repoCount").textContent = u.public_repos;
          $("followerCount").textContent = u.followers;
        })
        .catch(() => {});

      gh("users/" + GH_USER + "/repos?per_page=100&sort=pushed")
        .then((repos) => {
          data.allRepos = repos.filter((r) => !r.fork);
          data.repos = repos
            .filter((r) => !r.fork)
            .sort((a, b) => b.stargazers_count - a.stargazers_count || new Date(b.pushed_at) - new Date(a.pushed_at))
            .slice(0, 2);
        })
        .catch(() => (data.repos = null))
        .finally(() => {
          renderSpots();
          renderTopLang();
        });

      gh("users/" + GH_USER + "/events/public?per_page=8")
        .then((events) => (data.events = events))
        .catch(() => (data.events = null))
        .finally(renderLog);

      fetch("/api/valorant")
        .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
        .then((v) => (data.val = v))
        .catch(() => (data.val = null))
        .finally(renderValorant);

      // ---------- Mana motes ----------
      (function motes() {
        const cv = $("motes");
        const ctx = cv.getContext("2d");
        if (!ctx) return;
        let w, h, dpr, parts = [];
        const resize = () => {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = cv.width = innerWidth * dpr;
          h = cv.height = innerHeight * dpr;
          cv.style.width = innerWidth + "px";
          cv.style.height = innerHeight + "px";
          const count = Math.round(Math.min(90, (innerWidth * innerHeight) / 16000));
          parts = Array.from({ length: count }, () => spawn(true));
        };
        const spawn = (anywhere) => ({
          x: Math.random() * w,
          y: anywhere ? Math.random() * h : h + 10,
          r: (Math.random() * 1.6 + 0.4) * dpr,
          v: (Math.random() * 0.35 + 0.1) * dpr,
          drift: Math.random() * Math.PI * 2,
          hue: Math.random() < 0.75 ? "94,170,255" : "139,123,255",
          a: Math.random() * 0.6 + 0.2,
        });
        const draw = (t) => {
          ctx.clearRect(0, 0, w, h);
          for (const p of parts) {
            p.y -= p.v;
            p.x += Math.sin(t * 0.0006 + p.drift) * 0.2 * dpr;
            if (p.y < -10) Object.assign(p, spawn(false));
            ctx.beginPath();
            ctx.fillStyle = `rgba(${p.hue},${p.a})`;
            ctx.shadowColor = `rgba(${p.hue},0.9)`;
            ctx.shadowBlur = 8 * dpr;
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
          if (!reduced) requestAnimationFrame(draw);
        };
        addEventListener("resize", resize, { passive: true });
        resize();
        requestAnimationFrame(draw);
      })();
    </script>
  </body>
</html>

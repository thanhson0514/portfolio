<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - WiK1ngST</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      referrerpolicy="no-referrer"
    />
    <style>
      :root {
        --bg0: #05030f;
        --bg1: #120621;
        --card: rgba(20, 18, 42, 0.52);
        --card2: rgba(25, 20, 55, 0.42);
        --border: rgba(255, 255, 255, 0.14);
        --border2: rgba(255, 255, 255, 0.10);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.68);
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
        --radius-xl: 26px;
        --radius-lg: 18px;
        --radius-md: 14px;
        --ring: rgba(167, 139, 250, 0.42);
        --accent: #a78bfa;
        --accent2: #60a5fa;
        --green: #34d399;
        --orange: #fb923c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, "Apple Color Emoji", "Segoe UI Emoji";
        color: var(--text);
        overflow-x: hidden;
        background: radial-gradient(1200px 600px at 50% 30%, rgba(167, 139, 250, 0.12), transparent 55%),
          radial-gradient(900px 520px at 22% 52%, rgba(96, 165, 250, 0.12), transparent 52%),
          linear-gradient(180deg, var(--bg0), var(--bg1));
      }

      #three-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
      }

      #three-bg canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }

      /* Fallback text (dùng khi WebGL/three.js không hiển thị rõ) */
      #bgTextFallback {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 0;
        pointer-events: none;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        font-weight: 900;
        letter-spacing: 2px;
        font-size: clamp(56px, 9vw, 120px);
        color: rgba(167, 139, 250, 0.18);
        text-shadow:
          0 0 18px rgba(167, 139, 250, 0.30),
          0 0 44px rgba(96, 165, 250, 0.18);
        filter: blur(0.2px);
      }

      .wrap {
        position: relative;
        z-index: 1;
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 48px 18px;
      }

      .stack {
        width: min(520px, 92vw);
        display: grid;
        gap: 14px;
        justify-items: center;
      }

      .glassCard {
        width: 100%;
        border-radius: var(--radius-xl);
        background: linear-gradient(180deg, rgba(40, 32, 87, 0.34), rgba(20, 18, 42, 0.44));
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        position: relative;
        overflow: hidden;
      }

      .glassCard::after {
        content: "";
        position: absolute;
        inset: -2px;
        background: radial-gradient(600px 260px at 20% 0%, rgba(167, 139, 250, 0.30), transparent 60%),
          radial-gradient(440px 220px at 85% 10%, rgba(96, 165, 250, 0.18), transparent 55%);
        pointer-events: none;
      }

      .profile {
        padding: 22px 24px 18px;
      }

      .profileInner {
        position: relative;
        z-index: 1;
      }

      .rowTop {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .avatar {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(167, 139, 250, 0.35), rgba(96, 165, 250, 0.16));
        border: 1px solid rgba(167, 139, 250, 0.35);
        display: grid;
        place-items: center;
        box-shadow: 0 10px 30px rgba(167, 139, 250, 0.18);
        position: relative;
        overflow: hidden;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: inherit;
        position: absolute;
        inset: 0;
        z-index: 1;
        transform: scale(1.02);
        filter: drop-shadow(0 0 14px rgba(167, 139, 250, 0.45));
      }

      .avatar svg,
      .miniAvatar svg {
        display: none;
      }

      .pointsPill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border2);
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.85);
        font-weight: 650;
        font-size: 13px;
      }

      .flagVietnam {
        width: 22px;
        height: 11px;
        border-radius: 3px;
        box-shadow: 0 0 16px rgba(220, 38, 38, 0.15);
        flex: 0 0 auto;
        display: block;
        object-fit: contain;
      }

      .name {
        margin: 6px 0 2px;
        font-size: 22px;
        font-weight: 820;
        letter-spacing: 0.2px;
      }

      .role {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .roleTag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.10);
        background: rgba(255, 255, 255, 0.05);
      }

      .roleDot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: radial-gradient(circle at 35% 35%, rgba(52, 211, 153, 1), rgba(52, 211, 153, 0.2));
        box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.12);
      }

      .iconRow {
        display: flex;
        justify-content: center;
        gap: 12px;
        align-items: center;
        padding-top: 8px;
      }

      .iconBtn {
        width: 28px;
        height: 28px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
        text-decoration: none;
        color: rgba(255, 255, 255, 0.86);
        outline: none;
      }

      .iconBtn i {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.92);
      }

      .iconBtn:hover {
        transform: translateY(-2px);
        border-color: rgba(167, 139, 250, 0.45);
        background: rgba(167, 139, 250, 0.12);
      }

      .iconBtn:focus-visible {
        box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.25);
      }

      @keyframes scanFloat {
        0% {
          transform: translateY(-22px);
          opacity: 0;
        }
        25% {
          opacity: 0.7;
        }
        100% {
          transform: translateY(22px);
          opacity: 0;
        }
      }

      .glassCard,
      .subCard {
        transition: transform 260ms ease, border-color 260ms ease, box-shadow 260ms ease;
      }

      .glassCard::after {
        z-index: 0;
      }

      .glassCard::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        z-index: 0;
        pointer-events: none;
        opacity: 0;
        mix-blend-mode: screen;
        background:
          repeating-linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.06) 0px,
            rgba(255, 255, 255, 0.06) 1px,
            transparent 1px,
            transparent 4px
          ),
          linear-gradient(
            90deg,
            rgba(167, 139, 250, 0),
            rgba(167, 139, 250, 0.65),
            rgba(96, 165, 250, 0.55),
            rgba(167, 139, 250, 0)
          );
      }

      .glassCard:hover {
        transform: translateY(-4px);
        border-color: rgba(167, 139, 250, 0.5);
        box-shadow:
          0 0 0 1px rgba(167, 139, 250, 0.25),
          0 18px 70px rgba(0, 0, 0, 0.45),
          0 0 70px rgba(167, 139, 250, 0.14),
          0 0 55px rgba(96, 165, 250, 0.1);
      }

      .glassCard:hover::before {
        opacity: 1;
        animation: scanFloat 900ms linear infinite;
      }

      .subCard::after {
        z-index: 0;
      }

      .subCard::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        z-index: 0;
        pointer-events: none;
        opacity: 0;
        mix-blend-mode: screen;
        background:
          repeating-linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.06) 0px,
            rgba(255, 255, 255, 0.06) 1px,
            transparent 1px,
            transparent 4px
          ),
          linear-gradient(
            90deg,
            rgba(52, 211, 153, 0),
            rgba(52, 211, 153, 0.55),
            rgba(96, 165, 250, 0.55),
            rgba(52, 211, 153, 0)
          );
      }

      .subCard:hover {
        transform: translateY(-3px);
        border-color: rgba(52, 211, 153, 0.35);
        box-shadow:
          0 0 0 1px rgba(52, 211, 153, 0.18),
          0 18px 60px rgba(0, 0, 0, 0.4),
          0 0 65px rgba(52, 211, 153, 0.12),
          0 0 45px rgba(96, 165, 250, 0.1);
      }

      .subCard:hover::before {
        opacity: 1;
        animation: scanFloat 900ms linear infinite;
      }

      .techSection {
        position: relative;
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.11);
      }

      .techHeader {
        display: flex;
        align-items: center;
        gap: 10px;
        color: rgba(255, 255, 255, 0.86);
        font-weight: 780;
        font-size: 13px;
        margin-bottom: 10px;
      }

      .techGrid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .techBadge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        color: rgba(255, 255, 255, 0.88);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1px;
        transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
        user-select: none;
      }

      .techBadge:hover {
        transform: translateY(-2px);
        border-color: rgba(167, 139, 250, 0.45);
        background: rgba(167, 139, 250, 0.10);
      }

      .techDot {
        width: 10px;
        height: 10px;
        border-radius: 4px;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.06);
      }

      .indigo {
        border-color: rgba(99, 102, 241, 0.35);
        background: rgba(99, 102, 241, 0.12);
      }
      .indigo .techDot {
        background: radial-gradient(circle at 30% 30%, rgba(99, 102, 241, 1), rgba(99, 102, 241, 0.2));
      }

      .sky {
        border-color: rgba(56, 189, 248, 0.35);
        background: rgba(56, 189, 248, 0.12);
      }
      .sky .techDot {
        background: radial-gradient(circle at 30% 30%, rgba(56, 189, 248, 1), rgba(56, 189, 248, 0.2));
      }

      .emerald {
        border-color: rgba(16, 185, 129, 0.35);
        background: rgba(16, 185, 129, 0.12);
      }
      .emerald .techDot {
        background: radial-gradient(circle at 30% 30%, rgba(16, 185, 129, 1), rgba(16, 185, 129, 0.2));
      }

      .amber {
        border-color: rgba(245, 158, 11, 0.35);
        background: rgba(245, 158, 11, 0.12);
      }
      .amber .techDot {
        background: radial-gradient(circle at 30% 30%, rgba(245, 158, 11, 1), rgba(245, 158, 11, 0.2));
      }

      .rose {
        border-color: rgba(244, 63, 94, 0.35);
        background: rgba(244, 63, 94, 0.12);
      }
      .rose .techDot {
        background: radial-gradient(circle at 30% 30%, rgba(244, 63, 94, 1), rgba(244, 63, 94, 0.2));
      }

      .subCard {
        width: 100%;
        padding: 12px 14px;
        border-radius: var(--radius-lg);
        background: linear-gradient(180deg, rgba(70, 45, 160, 0.20), rgba(15, 14, 34, 0.35));
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 14px 50px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(9px);
        -webkit-backdrop-filter: blur(9px);
        position: relative;
        overflow: hidden;
      }

      .subCard::after {
        content: "";
        position: absolute;
        inset: -2px;
        background: radial-gradient(320px 120px at 0% 0%, rgba(167, 139, 250, 0.26), transparent 62%),
          radial-gradient(280px 120px at 100% 0%, rgba(96, 165, 250, 0.14), transparent 60%);
        pointer-events: none;
      }

      .subInner {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .subLeft {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .miniAvatar {
        width: 38px;
        height: 38px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.12);
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        position: relative;
        overflow: hidden;
      }

      .miniAvatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: inherit;
        position: absolute;
        inset: 0;
        z-index: 1;
        transform: scale(1.03);
        filter: drop-shadow(0 0 12px rgba(96, 165, 250, 0.35));
      }

      .subText {
        min-width: 0;
      }

      .subTitle {
        font-weight: 760;
        font-size: 14px;
        margin: 0;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .typingText {
        position: relative;
        display: inline-block;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        letter-spacing: 0.6px;
        padding-right: 10px;
      }

      .typingText::after {
        content: "";
        position: absolute;
        right: 0;
        top: 0.1em;
        width: 2px;
        height: 0.85em;
        background: rgba(96, 165, 250, 0.95);
        box-shadow: 0 0 12px rgba(96, 165, 250, 0.65);
        animation: typingBlink 0.9s steps(2) infinite;
      }

      @keyframes typingBlink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }

      .subHandle {
        margin: 2px 0 0;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .badgeRow {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.11);
        background: rgba(255, 255, 255, 0.05);
        font-size: 12px;
        color: rgba(255, 255, 255, 0.84);
      }

      .badge .spark {
        width: 10px;
        height: 10px;
        border-radius: 4px;
        background: radial-gradient(circle at 30% 30%, rgba(96, 165, 250, 1), rgba(96, 165, 250, 0.2));
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.16);
      }

      .sparkValorant {
        background: radial-gradient(circle at 30% 30%, rgba(239, 68, 68, 1), rgba(239, 68, 68, 0.22));
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.16);
      }

      .sparkCS2 {
        background: radial-gradient(circle at 30% 30%, rgba(99, 102, 241, 1), rgba(99, 102, 241, 0.22));
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.16);
      }

      .hint {
        margin-top: 16px;
        color: rgba(255, 255, 255, 0.55);
        font-size: 12px;
        text-align: center;
      }

      @media (max-width: 420px) {
        .profile {
          padding: 18px 16px 16px;
        }
        .name {
          font-size: 20px;
        }
        .iconRow {
          gap: 10px;
        }
      }
    </style>
  </head>

  <body>
    <div id="three-bg" aria-hidden="true"></div>
    <div id="bgTextFallback" aria-hidden="true">WiK1ngST</div>

    <div class="wrap">
      <div class="stack">
        <!-- Card chính -->
        <section class="glassCard profile" aria-label="Profile card">
          <div class="profileInner">
            <div class="rowTop">
              <div class="avatar" aria-hidden="true">
                <!-- Avatar SVG (xấp xỉ theo hình ảnh) -->
                <svg width="34" height="34" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <linearGradient id="pgrad" x1="12" y1="6" x2="52" y2="62" gradientUnits="userSpaceOnUse">
                      <stop stop-color="#A78BFA" stop-opacity="0.95" />
                      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.85" />
                    </linearGradient>
                    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                      <feGaussianBlur stdDeviation="2.2" result="blur" />
                      <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                      </feMerge>
                    </filter>
                  </defs>
                  <circle cx="32" cy="32" r="24" stroke="url(#pgrad)" stroke-width="2" opacity="0.65" />
                  <!-- Neon fish body (Song Ngu) -->
                  <path
                    d="M16 30C16 18 24 10 32 10C40 10 48 18 48 30C46 27 44 26 41 25C37 24 36 18 32 18C28 18 27 24 23 25C20 26 18 27 16 30Z"
                    fill="url(#pgrad)"
                    opacity="0.32"
                    filter="url(#glow)"
                  />
                  <path
                    d="M18 32C18 48 24 54 32 54C40 54 46 48 46 32C44 30 41 29 38 28C36 29 34 31 32 31C30 31 28 29 26 28C23 29 20 30 18 32Z"
                    fill="rgba(255,255,255,0.78)"
                    opacity="0.18"
                  />
                  <path
                    d="M22 40C24.5 36.5 27.5 35 32 35C36.5 35 39.5 36.5 42 40C39.2 45 36 47 32 47C28 47 24.8 45 22 40Z"
                    fill="#A78BFA"
                    opacity="0.22"
                  />
                  <circle cx="27" cy="30" r="4.1" fill="#05030f" />
                  <circle cx="37" cy="30" r="4.1" fill="#05030f" />
                  <circle cx="26.2" cy="28.8" r="1.4" fill="#22D3EE" opacity="0.9" />
                  <circle cx="36.2" cy="28.8" r="1.4" fill="#22D3EE" opacity="0.9" />
                  <!-- Pisces wave accents -->
                  <path
                    d="M18 50C24 44 28 44 32 44C36 44 40 44 46 50"
                    stroke="url(#pgrad)"
                    stroke-width="2.2"
                    opacity="0.7"
                    stroke-linecap="round"
                    filter="url(#glow)"
                  />
                  <path
                    d="M18 14C24 20 28 20 32 20C36 20 40 20 46 14"
                    stroke="url(#pgrad)"
                    stroke-width="2.2"
                    opacity="0.5"
                    stroke-linecap="round"
                  />
                  <!-- Small star -->
                  <path
                    d="M50 22l2.2 4.3L57 28.4l-4.6 1.1L50 34l-2.4-4.5L43 28.4l4.8-2.1L50 22Z"
                    fill="rgba(96,165,250,0.22)"
                    stroke="#60A5FA"
                    stroke-width="1.2"
                    opacity="0.9"
                    filter="url(#glow)"
                  />
                </svg>
                <img src="assets/whale.png" alt="" aria-hidden="true" />
              </div>

              <div class="pointsPill" title="Quốc tịch Việt Nam">
                <img
                  class="flagVietnam"
                  src="assets/vietnam-flag.png"
                  alt=""
                  aria-hidden="true"
                />
                <span>Việt Nam</span>
              </div>
            </div>

            <div class="name">
              <span id="typingName" class="typingText">WiK1ngST</span>
            </div>
            <div class="role">
              <span class="roleTag">
                <span class="roleDot" aria-hidden="true"></span>
                web developer
              </span>
            </div>

            <div class="iconRow" aria-label="Social links">
              <a class="iconBtn" href="https://github.com/thanhson0514" aria-label="GitHub" title="GitHub">
                <i class="fa-brands fa-github" aria-hidden="true"></i>
              </a>
              <a class="iconBtn" href="https://discordapp.com/users/1082880576178114663" aria-label="Discord" title="Discord">
                <i class="fa-brands fa-discord" aria-hidden="true"></i>
              </a>
              <a class="iconBtn" href="https://www.facebook.com/lethanhson0514/" aria-label="Facebook" title="Facebook">
                <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
              </a>
              <a class="iconBtn" href="https://steamcommunity.com/profiles/76561199273929295" aria-label="Steam" title="Steam">
                <i class="fa-brands fa-steam" aria-hidden="true"></i>
              </a>
            </div>

            <div class="techSection" aria-label="Tech stack">
              <div class="techHeader">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 2l9 5-9 5-9-5 9-5Z" fill="rgba(167,139,250,0.55)"/>
                  <path d="M3 7v10l9 5 9-5V7" stroke="rgba(255,255,255,0.55)" stroke-width="1.6" stroke-linejoin="round"/>
                  <path d="M12 12v10" stroke="rgba(96,165,250,0.7)" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
                Tech Stack
              </div>
              <div class="techGrid">
                <div class="techBadge indigo"><span class="techDot" aria-hidden="true"></span>ReactJS</div>
                <div class="techBadge indigo"><span class="techDot" aria-hidden="true"></span>Next.js</div>
                <div class="techBadge sky"><span class="techDot" aria-hidden="true"></span>TypeScript</div>
                <div class="techBadge sky"><span class="techDot" aria-hidden="true"></span>Node.js</div>
                <div class="techBadge emerald"><span class="techDot" aria-hidden="true"></span>NestJS</div>
                <div class="techBadge emerald"><span class="techDot" aria-hidden="true"></span>Express</div>
                <div class="techBadge amber"><span class="techDot" aria-hidden="true"></span>GraphQL</div>
                <div class="techBadge amber"><span class="techDot" aria-hidden="true"></span>REST APIs</div>
                <div class="techBadge rose"><span class="techDot" aria-hidden="true"></span>PostgreSQL</div>
                <div class="techBadge rose"><span class="techDot" aria-hidden="true"></span>Redis</div>
                <div class="techBadge sky"><span class="techDot" aria-hidden="true"></span>Tailwind CSS</div>
                <div class="techBadge indigo"><span class="techDot" aria-hidden="true"></span>Vite</div>

        <!-- Card phụ dưới -->
        <section class="subCard" aria-label="Social summary card">
          <div class="subInner">

                  </defs>
                  <circle cx="32" cy="32" r="24" stroke="url(#pgradMini)" stroke-width="2" opacity="0.62" />
                  <path
                    d="M16 30C16 18 24 10 32 10C40 10 48 18 48 30C46 27 44 26 41 25C37 24 36 18 32 18C28 18 27 24 23 25C20 26 18 27 16 30Z"
                    fill="url(#pgradMini)"
                    opacity="0.32"
                    filter="url(#glowMini)"
                  />
                  <path
                    d="M18 32C18 48 24 54 32 54C40 54 46 48 46 32C44 30 41 29 38 28C36 29 34 31 32 31C30 31 28 29 26 28C23 29 20 30 18 32Z"
                    fill="rgba(255,255,255,0.78)"

                  <path
                    d="M18 50C24 44 28 44 32 44C36 44 40 44 46 50"

                  <circle cx="27" cy="30" r="3.7" fill="#05030f" />

    <script type="module">
      import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

      const reduced =
        window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduced) {
        // Still render a single frame for a nice static background.
        // eslint-disable-next-line no-console
        // console.log("Reduced motion enabled");
      }

      // Typing effect for sub title.
      const typingEl = document.getElementById("typingTitle");
      const typingWords = ["WiK1ngST", "Wist"];
      if (typingEl) {
        if (reduced) {
          typingEl.textContent = typingWords[0];
          let idx = 0;
          setInterval(() => {
            idx = (idx + 1) % typingWords.length;
            typingEl.textContent = typingWords[idx];
          }, 2000);
        } else {
          let wordIdx = 0;
          let charIdx = 0;
          let deleting = false;
          const typeSpeed = 95;
          const deleteSpeed = 50;
          const pause = 780;

          const tick = () => {
            const word = typingWords[wordIdx];
            if (!deleting) {
              charIdx += 1;
              typingEl.textContent = word.slice(0, charIdx);
              if (charIdx >= word.length) {
                deleting = true;
                setTimeout(tick, pause);
                return;
              }
              setTimeout(tick, typeSpeed + Math.random() * 40);
            } else {
              charIdx -= 1;
              typingEl.textContent = word.slice(0, Math.max(0, charIdx));
              if (charIdx <= 0) {
                deleting = false;
                wordIdx = (wordIdx + 1) % typingWords.length;
                setTimeout(tick, 140);
                return;
              }
              setTimeout(tick, deleteSpeed);
            }
          };

          // Start after a short delay.
          setTimeout(tick, 500);
        }
      }

      const container = document.getElementById("three-bg");
      const fallbackEl = document.getElementById("bgTextFallback");
      let renderer, scene, camera, points, textSprite;
      let meteorsGroup;
      const meteors = [];
      let lastMeteorSpawn = 0;
      let nextMeteorDelayMs = 2600;
      let raf = 0;

      function createTextSprite(text) {
        // Neon canvas -> THREE sprite (dùng để có “chữ nổi” phía sau card).
        const canvas = document.createElement("canvas");
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = Math.floor(1024 * dpr);
        const h = Math.floor(420 * dpr);
        canvas.width = w;
        canvas.height = h;

        const ctx = canvas.getContext("2d");
        if (!ctx) return null;
        ctx.clearRect(0, 0, w, h);

        // Gradient neon.
        const grad = ctx.createLinearGradient(0, 0, w, 0);
        grad.addColorStop(0, "rgba(167, 139, 250, 0.95)");
        grad.addColorStop(0.5, "rgba(96, 165, 250, 0.95)");
        grad.addColorStop(1, "rgba(52, 211, 153, 0.85)");

        const fontSize = Math.floor(140 * dpr);
        ctx.font = `800 ${fontSize}px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Glow pass.
        ctx.shadowColor = "rgba(167, 139, 250, 0.65)";
        ctx.shadowBlur = Math.floor(26 * dpr);
        ctx.fillStyle = grad;
        ctx.fillText(text, w / 2, h / 2);

        // Neon outline to make the background text visible.
        ctx.lineWidth = Math.floor(12 * dpr);
        ctx.strokeStyle = "rgba(255,255,255,0.20)";
        ctx.strokeText(text, w / 2, h / 2);

        // Highlight offset tạo feel cyber/glitch nhẹ.
        ctx.shadowBlur = Math.floor(14 * dpr);
        ctx.shadowColor = "rgba(96, 165, 250, 0.55)";
        ctx.fillStyle = "rgba(255,255,255,0.22)";
        ctx.fillText(text, w / 2 + 4 * dpr, h / 2 - 3 * dpr);

        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;

        const material = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 0.7, // Neon, but still behind glass cards.
          depthWrite: false,
          depthTest: false,
          blending: THREE.AdditiveBlending,
          fog: false,
        });

        const sprite = new THREE.Sprite(material);
        sprite.scale.set(16, 6.2, 1);
        sprite.position.set(0, 0.32, -1.8);
        return sprite;
      }

      function spawnMeteor() {
        if (reduced) return; // tránh gây lag khi người dùng yêu cầu reduced motion
        if (!meteorsGroup) return;
        if (meteors.length >= 2) return; // giới hạn số vệt cùng lúc

        const x = (Math.random() - 0.5) * 8;
        const y = 3.5 + Math.random() * 1.5;
        const z = -5.5 + Math.random() * 2.5;

        // Hướng sao băng: rơi chéo xuống
        const dir = new THREE.Vector3(-0.8 + Math.random() * 0.4, -1, -0.15 + Math.random() * 0.3)
          .normalize();

        const length = 8 + Math.random() * 4;
        const speed = 18 + Math.random() * 6; // đơn vị / giây
        const duration = length / speed;

        const start = new THREE.Vector3(x, y, z);
        const end = start.clone().add(dir.clone().multiplyScalar(length));

        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(6); // 2 points (tail -> head)
        geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

        const material = new THREE.LineBasicMaterial({
          color: 0xfbbf24,
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });

        const line = new THREE.Line(geometry, material);
        meteorsGroup.add(line);

        // Cache for updates
        meteors.push({
          line,
          geometry,
          material,
          start,
          dir,
          length,
          speed,
          duration,
          age: 0,
          head: end,
        });

        // Initial placement
        const posAttr = geometry.getAttribute("position");
        posAttr.setXYZ(0, start.x, start.y, start.z); // tail
        posAttr.setXYZ(1, end.x, end.y, end.z); // head
        posAttr.needsUpdate = true;
      }

      function init() {
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        container.appendChild(renderer.domElement);

        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0b0820, 0.05);

        camera = new THREE.PerspectiveCamera(50, 1, 0.1, 80);
        camera.position.set(0, 0.6, 8);

        const palette = [0xa78bfa, 0x60a5fa, 0x34d399, 0xfbbf24, 0xfb923c];

        const count = 1200;
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);

        for (let i = 0; i < count; i++) {
          const ix = i * 3;
          const x = (Math.random() - 0.5) * 10;
          const y = (Math.random() - 0.5) * 6;
          const z = (Math.random() - 0.5) * 10;

          positions[ix + 0] = x;
          positions[ix + 1] = y;
          positions[ix + 2] = z;

          const c = palette[Math.floor(Math.random() * palette.length)];
          const color = new THREE.Color(c);
          colors[ix + 0] = color.r;
          colors[ix + 1] = color.g;
          colors[ix + 2] = color.b;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
          size: 0.045,
          vertexColors: true,
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });

        points = new THREE.Points(geometry, material);
        points.rotation.x = -0.25;
        scene.add(points);

        // Background text effect.
        textSprite = createTextSprite("WiK1ngST");
        if (textSprite) scene.add(textSprite);

        // Meteor shower (rất ít để đỡ lag)
        meteorsGroup = new THREE.Group();
        scene.add(meteorsGroup);
        lastMeteorSpawn = performance.now();

        window.addEventListener("resize", onResize, { passive: true });
        onResize();
      }

      function onResize() {
        if (!renderer || !camera) return;
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }

      function animate(t = 0) {
        if (!renderer || !scene || !camera) return;
        const time = t * 0.001;
        const now = performance.now();

        // Subtle motion to match a premium glass background.
        points.rotation.y = time * 0.12;
        points.rotation.x = -0.25 + Math.sin(time * 0.25) * 0.03;

        // Gentle breathing
        const scale = 1 + Math.sin(time * 0.35) * 0.015;
        points.scale.setScalar(scale);

        if (textSprite) {
          const pulse = 0.68 + Math.sin(time * 0.7) * 0.12;
          textSprite.material.opacity = reduced ? 0.52 : pulse;

          // Drift nhẹ, giữ cho chữ không “giật” quá nhiều.
          const jx = Math.sin(time * 1.15) * 0.26;
          const jy = Math.cos(time * 0.9) * 0.06;
          textSprite.position.x = jx;
          textSprite.position.y = 0.3 + jy;
          textSprite.rotation.z = Math.sin(time * 0.5) * 0.015;

          const s = 14.8 + Math.sin(time * 0.55) * 0.22;
          textSprite.scale.set(s, s * 0.39, 1);
        }

        // Spawn + update meteors
        if (now - lastMeteorSpawn >= nextMeteorDelayMs) {
          spawnMeteor();
          lastMeteorSpawn = now;
          nextMeteorDelayMs = 2400 + Math.random() * 1800; // tần suất hạn chế
        }

        for (let i = meteors.length - 1; i >= 0; i--) {
          const m = meteors[i];
          m.age += 1 / 60; // xấp xỉ (đỡ tính delta để đơn giản)
          const p = Math.min(1, m.age / m.duration);

          const traveled = m.speed * m.age;
          const head = m.start.clone().add(m.dir.clone().multiplyScalar(traveled));
          const tail = head.clone().sub(m.dir.clone().multiplyScalar(m.length));

          const posAttr = m.geometry.getAttribute("position");
          posAttr.setXYZ(0, tail.x, tail.y, tail.z);
          posAttr.setXYZ(1, head.x, head.y, head.z);
          posAttr.needsUpdate = true;

          // Fade out
          m.material.opacity = Math.max(0, 1 - p);

          if (p >= 1) {
            meteorsGroup.remove(m.line);
            m.geometry.dispose();
            m.material.dispose();
            meteors.splice(i, 1);
          }
        }

        renderer.render(scene, camera);

        if (!reduced) raf = requestAnimationFrame(animate);
      }

      try {
        init();
        animate();
        if (fallbackEl) fallbackEl.style.opacity = "0.14";
      } catch (e) {
        // If WebGL is blocked, do nothing (the page still looks okay via gradients/cards).
        // eslint-disable-next-line no-console
        console.warn("three.js init failed:", e);
      }
    </script>
